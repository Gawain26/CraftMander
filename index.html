<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftMander — Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <a class="nav-brand" href="index.html">⚒ CraftMander</a>
    <a href="index.html" class="active">Explorer</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="libraries.html">Libraries</a>
</nav>

<div class="page">
    <h1>Recipe Explorer</h1>
    <p class="page-subtitle">Search for recipes and add them to your watchlist.</p>

    <div class="layout layout-2col">

        <div class="panel">
            <div class="panel-header">
                <h2>Search Recipes</h2>
            </div>
            <input
                type="text"
                id="recipeSearch"
                placeholder="Type an item name…"
                autocomplete="off"
                autofocus
            >
            <ul id="searchResults">
                <li class="empty-state">Start typing to search recipes.</li>
            </ul>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h2>Watchlist</h2>
            </div>
            <ul id="explorerWatchlist"></ul>
        </div>

    </div>
</div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="crafting.js"></script>
<script src="watchlist.js"></script>
<script src="search.js"></script>
</body>
</html>
