<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>(function(){var t=localStorage.getItem('CraftManderTheme');if(t&&t!=='commander')document.documentElement.setAttribute('data-theme',t);})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftMander — Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <a class="nav-brand shimmer-eligible" href="index.html">⚒ CraftMander</a>
    <a href="explorer.html" class="active">Explorer</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="revenue.html">Revenue</a>
    <a href="libraries.html">Libraries</a>
    <a href="help.html">Help</a>
</nav>

<div class="page">
    <h1 class="shimmer-eligible">Recipe Explorer</h1>
    <p class="page-subtitle">Search for recipes and add them to your watchlist.</p>

    <div class="layout layout-2col">

        <div class="panel">
            <div class="panel-header">
                <h2>Search Recipes</h2>
            </div>
            <input
                type="text"
                id="recipeSearch"
                placeholder="Type an item name…"
                autocomplete="off"
                autofocus
            >
            <ul id="searchResults">
                <li class="empty-state">Start typing to search recipes.</li>
            </ul>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h2>Watchlist</h2>
                <button id="clearWatchlistBtn" class="clear-watchlist-btn" title="Clear entire watchlist">🗑</button>
            </div>
            <ul id="explorerWatchlist"></ul>
        </div>

    </div>
</div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/crafting.js"></script>
<script src="js/watchlist.js"></script>
<script src="js/search.js"></script>
<script src="js/api-panel.js"></script>
<script src="js/theme-panel.js"></script>
<script src="js/feedback-panel.js"></script>
</body>
</html>
